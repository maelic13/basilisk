# CI — correctness, sanitizers, compiler/ISA coverage and cross-platform bench
# agreement (8.6.4).
#
# This is the mandatory gate into master. It runs on a pull request into
# master, where GitHub builds the merge commit, so the run tests exactly what
# master would become, and on manual dispatch for any branch. It does not run
# on pushes: a push to master only ever lands a pull request that already
# passed, and a branch's commits are qualified locally (exact bench, CTest)
# as they are made. A newer commit to the same pull request cancels the superseded run.
#
# The bench job hardcodes NO expected node count. All platforms run bench and
# a final job asserts they AGREE with each other. A frozen constant would need
# editing on every behavioural commit until someone deleted the check;
# cross-platform agreement must hold forever regardless of what we change,
# and it is the one thing local development cannot verify. A disagreement
# means unsound code (UB), a data race, or float nondeterminism leaking into
# the search. It doubles as the compiler-bump UB canary (8.6.5's argument:
# node counts are deterministic integer logic).

name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Timeouts stop a stalled runner, not a slow test: each job's is about
  # three times its slowest successful run from 2026-09-27 to 2026-10-25;
  # sanitize's allows the 15-22 minute sanitizer CTest it ran until
  # 2026-10-08. Each install step's catches a hung package mirror in
  # minutes.
  # ---- Release-mode OS/architecture/ISA matrix -------------------------------
  test:
    name: test (${{ matrix.os_name }} ${{ matrix.arch }} ${{ matrix.tier }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            os_name: linux
            arch: x86_64
            tier: portable
            preset: release
            bench_id: linux-x86_64
          - runner: ubuntu-26.04
            os_name: linux
            arch: x86_64
            tier: avx2
            preset: release-avx2
            bench_id: linux-x86_64-avx2
          - runner: ubuntu-26.04
            os_name: linux
            arch: x86_64
            tier: pext
            preset: release-pext
            bench_id: linux-x86_64-pext
          - runner: ubuntu-26.04-arm
            os_name: linux
            arch: aarch64
            tier: portable
            preset: release
            bench_id: linux-aarch64
          - runner: windows-2025
            os_name: windows
            arch: x86_64
            tier: portable
            preset: release
            bench_id: windows-x86_64
            msystem: CLANG64
            mingw_pkg_prefix: mingw-w64-clang-x86_64
          - runner: windows-2025
            os_name: windows
            arch: x86_64
            tier: avx2
            preset: release-avx2
            bench_id: windows-x86_64-avx2
            msystem: CLANG64
            mingw_pkg_prefix: mingw-w64-clang-x86_64
          - runner: windows-2025
            os_name: windows
            arch: x86_64
            tier: pext
            preset: release-pext
            bench_id: windows-x86_64-pext
            msystem: CLANG64
            mingw_pkg_prefix: mingw-w64-clang-x86_64
          - runner: windows-11-arm
            os_name: windows
            arch: aarch64
            tier: portable
            preset: release
            bench_id: windows-aarch64
            msystem: CLANGARM64
            mingw_pkg_prefix: mingw-w64-clang-aarch64
          - runner: macos-26
            os_name: macos
            arch: aarch64
            tier: portable
            preset: release
            bench_id: macos-aarch64
    defaults:
      run:
        shell: ${{ matrix.os_name == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The ubuntu-26.04 images preinstall Clang 20-22, CMake and Ninja, so the
      # build itself downloads nothing; Clang 22 is the newest. The image lacks
      # Clang's LLVM tools (llvm-objdump for the ISA checks), so the one
      # package carrying them is installed, its .deb files cached by image
      # version: a slow Ubuntu mirror once timed this step out mid-download.
      - name: Image version (Linux)
        id: image
        if: runner.os == 'Linux'
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache LLVM packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: llvm-22-${{ matrix.runner }}-${{ steps.image.outputs.version }}
          restore-keys: llvm-22-${{ matrix.runner }}-

      - name: Select Clang 22 and its LLVM tools (Linux)
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          command -v clang++-22 >/dev/null || { echo "FAIL: the image has no clang-22"; exit 1; }
          if ! command -v llvm-objdump-22 >/dev/null; then
            mkdir -p ~/apt-debs
            sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends llvm-22
            cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          fi
          sudo ln -sf /usr/bin/clang-22        /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-22      /usr/local/bin/clang++
          sudo ln -sf /usr/bin/llvm-objdump-22 /usr/local/bin/llvm-objdump
          clang++ --version
          llvm-objdump --version | head -n 2
          cmake --version | head -n 1
          ninja --version

      - name: Set up MSYS2 / Clang (Windows)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.mingw_pkg_prefix }}-clang
            ${{ matrix.mingw_pkg_prefix }}-llvm
            ${{ matrix.mingw_pkg_prefix }}-python
            ${{ matrix.mingw_pkg_prefix }}-cmake
            ${{ matrix.mingw_pkg_prefix }}-ninja

      # The Windows compiler's LLVM major is pinned: .github/windows-clang-version
      # names the major every measurement uses, and a cell on another fails, so a
      # major step is read for speed before it ships (agents/measurement.md).
      # Patch releases pass and are printed here.
      - name: Check the pinned Clang (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          want="$(tr -d '[:space:]' < .github/windows-clang-version)"
          got="$(clang --version | head -n 1)"
          echo "$got"
          llvm-profdata --version | head -n 2
          case "$got" in
            *"clang version $want."*) ;;
            *) echo "FAIL: clang is not LLVM $want, the pinned major (.github/windows-clang-version)"; exit 1 ;;
          esac

      # macOS uses the preinstalled AppleClang + libc++ (libc++'s <expected> is
      # not gated on __cpp_concepts, so no version bump is needed here). The
      # Xcode major is pinned as the Windows clang major is; the image ships
      # CMake and Ninja.
      - name: Check the pinned Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          want="$(tr -d '[:space:]' < .github/xcode-version)"
          got="$(xcodebuild -version | head -n 1)"
          echo "$got"; clang --version | head -n 1; ninja --version
          case "$got" in
            "Xcode $want"|"Xcode $want."*) ;;
            *) echo "FAIL: $got is not Xcode $want, the pinned major (.github/xcode-version)"; exit 1 ;;
          esac

      # PORTABLE_BUILD disables host-native tuning; the explicit AVX2/PEXT
      # presets remain active and therefore exercise their committed tier.
      - name: Configure and build (Release, TUNE off)
        run: |
          cmake --preset ${{ matrix.preset }} -DPORTABLE_BUILD=ON -DCOMP=clang \
            -DTUNE=OFF -DDIAGNOSTIC=OFF -DABLATION=OFF -DTEXEL=OFF
          cmake --build --preset ${{ matrix.preset }}

      - name: CTest
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Bench fingerprint
        id: bench
        run: |
          out=$(printf "bench 10\nquit\n" | ./build/${{ matrix.preset }}/basilisk*)
          echo "$out" | tail -8
          nodes=$(echo "$out" | grep -oE "Nodes searched *: *[0-9]+" | grep -oE "[0-9]+$")
          [ -n "$nodes" ] || { echo "FAIL: no node count"; exit 1; }
          echo "$nodes" > bench-${{ matrix.bench_id }}.txt

      - name: Upload bench fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.bench_id }}
          path: bench-${{ matrix.bench_id }}.txt

      - name: Verify x86 ISA contract
        if: matrix.arch == 'x86_64'
        run: |
          objdump=$(command -v llvm-objdump || true)
          python=$(command -v python3 || command -v python || true)
          [ -n "$objdump" ] || { echo "FAIL: llvm-objdump not found"; exit 1; }
          [ -n "$python" ] || { echo "FAIL: python not found"; exit 1; }
          binary="build/${{ matrix.preset }}/basilisk"
          [ -f "${binary}.exe" ] && binary="${binary}.exe"
          launcher=$(find "build/${{ matrix.preset }}/CMakeFiles/basilisk_launcher.dir" \
            -type f \( -name 'main.cpp.o' -o -name 'main.cpp.obj' \) -print -quit)
          [ -n "$launcher" ] || { echo "FAIL: baseline launcher object not found"; exit 1; }
          "$python" tools/diag/verify_isa.py \
            --tier "${{ matrix.tier }}" --binary "$binary" \
            --launcher-object "$launcher" --objdump "$objdump"

      # TUNE build must also stay compilable — it is what every SPRT/SPSA
      # binary is built from (release-pext locally; feature parity is what
      # matters here, not the ISA tier).
      # The ARM64 contract: the TT prefetch must compile to prfm, and nothing
      # beyond baseline ARMv8 with NEON may appear (tools/diag/verify_isa.py).
      - name: Verify ARM64 ISA contract
        if: matrix.arch == 'aarch64'
        run: |
          # macOS has no llvm-objdump on PATH; its objdump is Xcode's LLVM one.
          objdump=$(command -v llvm-objdump || command -v objdump || true)
          python=$(command -v python3 || command -v python || true)
          [ -n "$objdump" ] || { echo "FAIL: no objdump found"; exit 1; }
          [ -n "$python" ] || { echo "FAIL: python not found"; exit 1; }
          binary="build/${{ matrix.preset }}/basilisk"
          [ -f "${binary}.exe" ] && binary="${binary}.exe"
          "$python" tools/diag/verify_isa.py --tier arm64 --binary "$binary" --objdump "$objdump"

      - name: Configure and build (Release, TUNE on)
        run: |
          cmake --preset ${{ matrix.preset }} -DPORTABLE_BUILD=ON -DCOMP=clang \
            -DTUNE=ON -DDIAGNOSTIC=OFF -DABLATION=OFF -DTEXEL=OFF
          cmake --build --preset ${{ matrix.preset }} --target basilisk test_uci_protocol
          ctest --test-dir build/${{ matrix.preset }} -R test_uci_protocol --output-on-failure --no-tests=error

  # ---- Build flavors (Linux x86_64 PEXT): diagnostic, ablation, TEXEL -----
  # Kept out of the test matrix, as Rarog keeps its feature builds, so a flavor
  # failure fails this job and never hides the bench agreement.
  flavors:
    name: build flavors (linux x86_64 pext)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Clang 22
        # Preinstalled on the image, with CMake and Ninja; see the test job.
        run: |
          sudo ln -sf /usr/bin/clang-22   /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++
          clang++ --version

      - name: Build and test diagnostic-only flavor
        run: |
          cmake --preset release-pext -B build/diag-pext -DPORTABLE_BUILD=ON -DCOMP=clang \
            -DTUNE=OFF -DDIAGNOSTIC=ON -DABLATION=OFF -DTEXEL=OFF
          cmake --build build/diag-pext --target basilisk test_uci_protocol
          ctest --test-dir build/diag-pext -R test_uci_protocol --output-on-failure --no-tests=error

      - name: Build and test ablation flavor
        run: |
          cmake --preset release-pext -B build/ablate-pext -DPORTABLE_BUILD=ON -DCOMP=clang \
            -DTUNE=OFF -DDIAGNOSTIC=OFF -DABLATION=ON -DTEXEL=OFF
          cmake --build build/ablate-pext --target basilisk test_uci_protocol
          ctest --test-dir build/ablate-pext -R test_uci_protocol --output-on-failure --no-tests=error

      - name: Build and verify TEXEL flavor
        run: |
          cmake --preset release-pext -B build/texel-pext -DPORTABLE_BUILD=ON -DCOMP=clang \
            -DTUNE=OFF -DDIAGNOSTIC=OFF -DABLATION=OFF -DTEXEL=ON
          cmake --build build/texel-pext --target basilisk-texel
          ./build/texel-pext/basilisk-texel --verify tools/texel/test_positions.csv

      - name: Reject invalid build combinations
        run: |
          if cmake --preset release-pext -B build/invalid-isa -DUSE_AVX2=ON; then
            echo "FAIL: USE_PEXT+USE_AVX2 was accepted"
            exit 1
          fi
          if cmake --preset release-pext -B build/invalid-flavor -DTUNE=ON -DDIAGNOSTIC=ON; then
            echo "FAIL: TUNE+DIAGNOSTIC was accepted"
            exit 1
          fi

  # ---- Debug + ASan/UBSan (the gate 8.6.2b P0 repaired — keep it real) ------
  # ---- Documents -------------------------------------------------------------
  # The roadmap and GUIDE agree, every commit a document cites stays reachable
  # (on master, under a pull request or on a kept tag), and the release check
  # passes its own tests.
  docs:
    name: documents
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Roadmap and GUIDE agree
        run: python3 tools/diag/check_roadmap.py

      - name: Cited commits stay reachable
        run: |
          git fetch -q origin "+refs/pull/*/head:refs/remotes/origin/pr/*"
          python3 tools/diag/check_citations.py

      - name: Release check tests
        run: python3 tools/diag/test_release_check.py

      - name: ISA contract tests
        run: python3 tools/diag/test_verify_isa.py

  sanitize:
    name: sanitize (linux ASan+UBSan)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Clang 22
        # Preinstalled on the image with its sanitizer runtimes; see the test job.
        run: |
          sudo ln -sf /usr/bin/clang-22   /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++
          clang++ --version

      - name: Configure and build (Debug, sanitizers)
        run: |
          cmake --preset debug -DCOMP=clang
          cmake --build --preset debug

      # The strength floors reproduce the release job's deterministic numbers
      # many times more slowly here and add no memory-safety coverage of their
      # own, so the sanitizer run is the correctness suite alone.
      - name: CTest under sanitizers
        run: ctest --test-dir build/debug --output-on-failure --timeout 600 -LE strength --no-tests=error

  # ---- Real GCC PGO generation/consumption smoke ----------------------------
  # A plain GCC compile does not prove that its path-keyed .gcda files were
  # generated and consumed. Exercise the complete orchestrator on every CI run.
  gcc-pgo:
    name: GCC PGO (linux x86_64)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check GCC
        # The image's default GCC (15), with CMake and Ninja, is preinstalled.
        run: g++ --version

      - name: Build and train portable GCC PGO
        run: |
          cmake --preset release -DPORTABLE_BUILD=ON -DCOMP=gcc
          cmake --build --preset release --target pgo

      - name: Search with the optimized binary
        run: |
          binary=build/release-pgo-generate/basilisk
          test -x "$binary" || { echo "FAIL: PGO binary missing: $binary"; exit 1; }
          out=$(printf "bench 10\nquit\n" | "$binary")
          echo "$out" | tail -8
          nodes=$(echo "$out" | grep -oE "Nodes searched *: *[0-9]+" | grep -oE "[0-9]+$")
          [ -n "$nodes" ] || { echo "FAIL: GCC PGO bench produced no node count"; exit 1; }

  # ---- Cross-platform/ISA bench agreement (no hardcoded value) --------------
  bench-agreement:
    name: bench agreement
    needs: test
    # Not skipped when one cell fails: every cell fingerprints before its later
    # checks, and a cell that never fingerprinted is reported missing below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download fingerprints
        # v7, not v8: download-artifact v8 stopped auto-unzipping (Content-Type
        # dependent) + moved to ESM + errors on hash mismatch, any of which could
        # break the bench-*.txt glob below. v7 is Node 24 (no deprecation) and
        # keeps the v4 extraction behavior this job relies on.
        uses: actions/download-artifact@v7
        with:
          pattern: bench-*
          merge-multiple: true

      - name: Compare
        run: |
          echo "Collected fingerprints:"
          for f in bench-*.txt; do echo "  $f: $(cat "$f")"; done
          cells=$(ls bench-*.txt | wc -l)
          if [ "$cells" -ne 9 ]; then
            echo "FAIL: $cells of 9 matrix cells reported a fingerprint."
            exit 1
          fi
          count=$(cat bench-*.txt | sort -u | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "FAIL: platforms disagree on the bench node count."
            echo "This is UB, a data race, or nondeterminism leaking into the search."
            exit 1
          fi
          echo "All platforms agree: $(cat bench-*.txt | sort -u)"

  # ---- One required check for the whole workflow ----------------------------
  # Branch protection requires this job, not the matrix cells, so the required
  # set does not change with the matrix. It always runs and fails unless every
  # job it needs succeeded: GitHub reports a job skipped after a failed
  # dependency as passing, so a required job must never be skipped.
  complete:
    name: CI complete
    needs: [test, flavors, docs, sanitize, gcc-pgo, bench-agreement]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Every CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS"
          exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) && 1 || 0 }}
