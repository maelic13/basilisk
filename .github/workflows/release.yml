name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to upload assets to (for example v1.3.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }}${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
            arch: x86_64
            ext: ""
            preset: release
            compiler: clang
            asset_suffix: ""

          - runner: ubuntu-latest
            os_name: linux
            arch: x86_64
            ext: ""
            preset: release-avx2
            compiler: clang
            asset_suffix: "-avx2"

          - runner: ubuntu-latest
            os_name: linux
            arch: x86_64
            ext: ""
            preset: release-pext
            compiler: clang
            asset_suffix: "-pext"

          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            ext: ""
            preset: release
            compiler: clang
            asset_suffix: ""

          - runner: windows-latest
            os_name: windows
            arch: x86_64
            ext: ".exe"
            preset: release
            compiler: clang
            asset_suffix: ""
            msystem: CLANG64
            mingw_pkg_prefix: mingw-w64-clang-x86_64
            compiler_pkg: clang

          - runner: windows-latest
            os_name: windows
            arch: x86_64
            ext: ".exe"
            preset: release-avx2
            compiler: clang
            asset_suffix: "-avx2"
            msystem: CLANG64
            mingw_pkg_prefix: mingw-w64-clang-x86_64
            compiler_pkg: clang

          - runner: windows-latest
            os_name: windows
            arch: x86_64
            ext: ".exe"
            preset: release-pext
            compiler: clang
            asset_suffix: "-pext"
            msystem: CLANG64
            mingw_pkg_prefix: mingw-w64-clang-x86_64
            compiler_pkg: clang

          - runner: windows-11-arm
            os_name: windows
            arch: aarch64
            ext: ".exe"
            preset: release
            compiler: clang
            asset_suffix: ""
            msystem: CLANGARM64
            mingw_pkg_prefix: mingw-w64-clang-aarch64
            compiler_pkg: clang

          - runner: macos-latest
            os_name: macos
            arch: aarch64
            ext: ""
            preset: release
            compiler: clang
            asset_suffix: ""

    steps:
      - name: Configure Git line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clang, LLVM and Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          # clang-19, NOT the distro-default clang-18. All Linux runners here are
          # 24.04 (ubuntu-latest + ubuntu-24.04-arm). The engine returns
          # std::expected (C++23, added in 8.6); on Linux clang uses libstdc++,
          # whose <expected> body is guarded behind __cpp_concepts >= 202002L.
          # clang-18 only defines 201907L, so the header is empty and the build
          # fails ("no template named 'expected'"). clang-19 defines 202002L.
          # Keeps clang + libstdc++, so the shipped binary is dynamically linked
          # and portable exactly as before (bench 11,941,440 unchanged).
          sudo apt-get install -y clang-19 llvm-19 ninja-build
          sudo ln -sf /usr/bin/clang-19   /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
          clang++ --version
          # Verify the exact llvm-profdata selected by the clang driver. The
          # PGO target uses this same lookup rather than PATH ordering.
          pd=$(clang++ --print-prog-name=llvm-profdata)
          [ -x "$pd" ] || { echo "FAIL: clang companion llvm-profdata not found: $pd"; exit 1; }
          "$pd" --version

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          ninja --version

      - name: Set up MSYS2 / Clang (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            ${{ matrix.mingw_pkg_prefix }}-${{ matrix.compiler_pkg }}
            ${{ matrix.mingw_pkg_prefix }}-llvm
            ${{ matrix.mingw_pkg_prefix }}-cmake
            ${{ matrix.mingw_pkg_prefix }}-ninja

      # Build the PGO ('pgo' custom target) production binary from this exact
      # revision + production flags (TUNE off), portable (no -march=native).
      # It instruments, trains on the bench suite, merges the profile and links
      # the optimised binary into build/dist. The pgo target is self-contained.
      - name: Configure and build PGO (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --preset ${{ matrix.preset }} -DPORTABLE_BUILD=ON -DCOMP=${{ matrix.compiler }} -DBASILISK_DIST_TAG="$RELEASE_TAG"
          cmake --build --preset ${{ matrix.preset }} --target pgo

      - name: Configure and build PGO (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --preset ${{ matrix.preset }} -DPORTABLE_BUILD=ON -DCOMP=${{ matrix.compiler }} -DBASILISK_DIST_TAG="$RELEASE_TAG"
          cmake --build --preset ${{ matrix.preset }} --target pgo

      - name: Locate the PGO binary and name it for release
        id: asset
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          os="${{ matrix.os_name }}"; arch="${{ matrix.arch }}"
          ext="${{ matrix.ext }}"; suffix="${{ matrix.asset_suffix }}"
          # CMake names the PGO dist binary with a -pgo suffix; publish it under
          # the plain tier name (no -pgo), matching the 1.8.0 asset format.
          built="build/dist/basilisk-${tag}-${os}-${arch}${suffix}-pgo${ext}"
          [ -f "$built" ] || { echo "FAIL: PGO binary $built not found"; ls -la build/dist || true; exit 1; }
          asset="basilisk-${tag}-${os}-${arch}${suffix}${ext}"
          cp "$built" "build/dist/${asset}"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "path=build/dist/${asset}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the exact binary being published
        shell: bash
        run: |
          binary="${{ steps.asset.outputs.path }}"
          if command -v timeout >/dev/null 2>&1; then TIMEOUT="timeout 60";
          elif command -v gtimeout >/dev/null 2>&1; then TIMEOUT="gtimeout 60";
          else TIMEOUT=""; fi
          output=$(printf "uci\nquit\n" | $TIMEOUT "./$binary" 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "uciok" || { echo "FAIL: uciok not found"; exit 1; }
          version="${RELEASE_TAG#v}"
          echo "$output" | grep -qF "$version" || { echo "FAIL: version $version not found"; exit 1; }
          # 8.6.5b (Rarog 9.3 pattern): the uploaded artifact must SEARCH, not
          # just answer the handshake -- a real bench node count proves the
          # move generator, evaluator and search survived PGO on this runner.
          bench_out=$(printf "bench 6\nquit\n" | $TIMEOUT "./$binary" 2>&1 || true)
          nodes=$(echo "$bench_out" | grep -oE "Nodes searched *: *[0-9]+" | grep -oE "[0-9]+$" || true)
          [ -n "$nodes" ] && [ "$nodes" -gt 0 ] || { echo "FAIL: bench produced no node count"; echo "$bench_out" | tail -20; exit 1; }
          echo "Smoke test passed (bench 6: $nodes nodes)"
          # Record the exact count for the cross-binary agreement job below.
          echo "$nodes" > "relbench-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.asset_suffix }}.txt"

      - name: Upload bench fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: relbench-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.asset_suffix }}
          path: relbench-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.asset_suffix }}.txt

      - name: Upload binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="${{ steps.asset.outputs.asset }}"
          gh release upload "$RELEASE_TAG" "build/dist/${asset}" --clobber

  # ---- Cross-binary bench agreement (no hardcoded value) ---------------------
  # Every published binary already smoke-tested bench-6 > 0 in its own job; this
  # asserts all nine PGO production binaries (including the ARM tiers that full
  # CI never runs) produced the IDENTICAL node count. Search is deterministic
  # integer logic, so any disagreement means a PGO/codegen miscompile or UB on
  # that platform. Detect-after by design: assets are already attached when this
  # runs — a red X here means fix and re-run, not silent shipping.
  bench-agreement:
    name: release bench agreement
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download fingerprints
        # v7, not v8 — same reasoning as ci.yml (v8 no longer auto-unzips).
        uses: actions/download-artifact@v7
        with:
          pattern: relbench-*
          merge-multiple: true

      - name: Compare
        run: |
          echo "Collected fingerprints:"
          for f in relbench-*.txt; do echo "  $f: $(cat "$f")"; done
          count=$(cat relbench-*.txt | sort -u | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "FAIL: published binaries disagree on the bench node count."
            echo "This is a PGO/codegen miscompile or UB on the outlier platform."
            exit 1
          fi
          echo "All published binaries agree: $(cat relbench-*.txt | sort -u)"
