name: Release
run-name: ${{ github.ref_type == 'tag' && github.ref_name || format('release candidate {0}', github.sha) }}

# A release is cut by pushing a `vX.Y.Z` tag on master, or, for a patch while
# master holds unreleased work, on a branch cut from the `vX.Y.0` release; nothing
# else creates one. The workflow validates first (tools/diag/release_check.py:
# the tag names the version both CMakeLists.txt and src/constants.h declare, the
# tagged commit is on master or on that patch line, CHANGELOG.md has a dated
# section for it, and GUIDE marks it released), builds the five PGO assets
# read-only (x86-64 as the universal binary, its three tiers each a PGO build
# with functions aligned to 64 bytes;
# analysis/universal_binary_2026-10.md), benches every one and every x86
# tier, checks the x86 tier selection under Intel SDE, asserts a single
# `bench 13` fingerprint
# across the matrix equal to the one GUIDE declares, and only then one job
# with write permission publishes the
# release with every asset and the notes taken from that CHANGELOG section.
# Nothing exists on GitHub until every cell has passed, so a failed run is
# repaired by deleting the tag, fixing master and tagging again.
#
# A pull request into master runs the same build, bench and fingerprint checks
# as a candidate, so a green PR is a releasable one; when the version is a
# plain X.Y.Z it also runs the release check (all but the tag's name and the
# commit on master). A manual dispatch does the same on a chosen ref, the
# rehearsal. Neither creates a tag or a release.
#
# Only `v<major>.<minor>.<patch>` tags trigger this, never `oracle/...` or
# `archive/...` markers.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer commit on the same pull request supersedes its candidate build; tag
# and dispatch runs are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Timeouts stop a stalled runner, not a slow test: each job's is about
  # three times its slowest successful run from 2026-09-27 to 2026-10-25,
  # and each install step's catches a hung package mirror in minutes.
  prepare:
    name: Validate the version, the changelog and the declared fingerprint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.meta.outputs.mode }}
      version: ${{ steps.meta.outputs.version }}
      expected_nodes: ${{ steps.meta.outputs.expected_nodes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python3 tools/diag/release_check.py check "$GITHUB_REF_NAME" --base origin/master --notes release-notes.md
            mode=release
            version="${GITHUB_REF_NAME#v}"
          else
            mode=candidate
            version="$(python3 tools/diag/release_check.py version)"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # A plain version declares this commit a release: it passes every
              # check the tag run makes except the tag's name and the commit on
              # master (`--base HEAD` waives it), so a green PR is releasable.
              python3 tools/diag/release_check.py check "v$version" --base HEAD --notes release-notes.md
            else
              echo "Candidate build of $GITHUB_SHA at version $version; nothing is published." > release-notes.md
            fi
          fi
          # GUIDE declares the fingerprint once; release_check.py reads it with
          # the roadmap checker's parser. Every asset must reproduce it, and a
          # cross-platform mismatch is investigated, never waived.
          expected="$(python3 tools/diag/release_check.py fingerprint)"
          test -n "$expected"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "expected_nodes=$expected" >> "$GITHUB_OUTPUT"
          echo "mode $mode, version $version, expected bench 13 nodes $expected"

      - name: Upload the release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.os_name }} ${{ matrix.arch }}${{ matrix.asset_suffix }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # An x86-64 cell builds four PGO tiers.
    timeout-minutes: 80
    env:
      RELEASE_TAG: v${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_name: linux
            arch: x86_64
            ext: ""
            preset: universal
            target: universal
            compiler: clang
            asset_suffix: ""

          - runner: ubuntu-24.04-arm
            os_name: linux
            arch: aarch64
            ext: ""
            preset: release
            target: pgo
            compiler: clang
            asset_suffix: ""

          - runner: windows-2025
            os_name: windows
            arch: x86_64
            ext: ".exe"
            preset: universal
            target: universal
            compiler: clang
            asset_suffix: ""
            msystem: CLANG64
            mingw_pkg_prefix: mingw-w64-clang-x86_64
            compiler_pkg: clang

          - runner: windows-11-arm
            os_name: windows
            arch: aarch64
            ext: ".exe"
            preset: release
            target: pgo
            compiler: clang
            asset_suffix: ""
            msystem: CLANGARM64
            mingw_pkg_prefix: mingw-w64-clang-aarch64
            compiler_pkg: clang

          - runner: macos-26
            os_name: macos
            arch: aarch64
            ext: ""
            preset: release
            target: pgo
            compiler: clang
            asset_suffix: ""

    steps:
      - name: Configure Git line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Release assets do not depend on the build image's system: Linux links
      # statically and macOS targets macOS 13.3; the steps after the build
      # check both. 13.3 rather than 11, the first release for Apple silicon:
      # libc++'s std::format instantiates its floating-point formatter in
      # every call, and that needs a to_chars macOS ships only from 13.3.
      # Every Apple silicon Mac runs 13.3.
      # Linux still builds on ubuntu-24.04: a static binary carries the C++
      # library, and ubuntu-26.04's libstdc++.a holds AVX2, LZCNT and POPCNT
      # code outside any runtime dispatch, which the portable ISA check
      # rejects (PR #14); 24.04's is built for the baseline CPU. Its newest
      # Clang is 18 and the engine needs 19 or later (libstdc++'s
      # std::expected), so Clang 19 is downloaded, its .deb files cached by
      # image version: a slow Ubuntu mirror once timed this step out
      # mid-download. When GitHub retires the ubuntu-24.04 image, the Linux
      # cells run in an ubuntu:24.04 container on the newest image, which
      # keeps that baseline libstdc++.a; the shared region of the universal
      # ISA check fails first if the library ever carries more.
      - name: Image version (Linux)
        id: image
        if: runner.os == 'Linux'
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache Clang packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: clang-19-${{ matrix.runner }}-${{ steps.image.outputs.version }}
          restore-keys: clang-19-${{ matrix.runner }}-

      - name: Install Clang 19 and its LLVM tools (Linux)
        timeout-minutes: 10
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update -q
          sudo apt-get install -y clang-19 llvm-19
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          sudo ln -sf /usr/bin/clang-19        /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-19      /usr/local/bin/clang++
          sudo ln -sf /usr/bin/llvm-objdump-19 /usr/local/bin/llvm-objdump
          clang++ --version
          # Verify the exact llvm-profdata selected by the clang driver. The
          # PGO target uses this same lookup rather than PATH ordering.
          pd=$(clang++ --print-prog-name=llvm-profdata)
          [ -x "$pd" ] || { echo "FAIL: clang companion llvm-profdata not found: $pd"; exit 1; }
          "$pd" --version

      # The macOS compiler is the image's AppleClang, so its Xcode major is
      # pinned as the Windows clang major is: .github/xcode-version names it
      # and a cell on another fails, so an image update cannot change the
      # compiler unseen. The macos-26 image ships Ninja.
      - name: Check the pinned Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          want="$(tr -d '[:space:]' < .github/xcode-version)"
          # xcodebuild aborts when head closes the pipe; read it whole.
          got="$(xcodebuild -version)"; got="${got%%$'\n'*}"
          echo "$got"; clang --version | head -n 1; ninja --version
          case "$got" in
            "Xcode $want"|"Xcode $want."*) ;;
            *) echo "FAIL: $got is not Xcode $want, the pinned major (.github/xcode-version)"; exit 1 ;;
          esac

      - name: Set up MSYS2 / Clang (Windows)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.mingw_pkg_prefix }}-${{ matrix.compiler_pkg }}
            ${{ matrix.mingw_pkg_prefix }}-llvm
            ${{ matrix.mingw_pkg_prefix }}-python
            ${{ matrix.mingw_pkg_prefix }}-cmake
            ${{ matrix.mingw_pkg_prefix }}-ninja

      # The Windows compiler's LLVM major is pinned: .github/windows-clang-version
      # names the major every measurement uses, and a cell on another fails, so a
      # major step is read for speed before it ships (agents/measurement.md).
      # Patch releases pass and are printed here.
      - name: Check the pinned Clang (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          want="$(tr -d '[:space:]' < .github/windows-clang-version)"
          got="$(clang --version | head -n 1)"
          echo "$got"
          llvm-profdata --version | head -n 2
          case "$got" in
            *"clang version $want."*) ;;
            *) echo "FAIL: clang is not LLVM $want, the pinned major (.github/windows-clang-version)"; exit 1 ;;
          esac

      # Build the PGO ('pgo' custom target) production binary from this exact
      # revision + production flags (TUNE off), portable (no -march=native).
      # It instruments, trains on the bench suite, merges the profile and links
      # the optimised binary into build/dist. The pgo target is self-contained.
      # On x86-64 the 'universal' target runs it once per tier and links the
      # tiers behind the baseline dispatcher.
      # MACOSX_DEPLOYMENT_TARGET reaches the PGO target's child builds through
      # the environment; STATIC_RUNTIME is forwarded by the pgo target itself.
      - name: Configure and build PGO (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '13.3' || '' }}
        run: |
          static=OFF
          [ "$RUNNER_OS" = Linux ] && static=ON
          cmake --preset ${{ matrix.preset }} -DPORTABLE_BUILD=ON -DCOMP=${{ matrix.compiler }} \
            -DSTATIC_RUNTIME=$static -DBASILISK_DIST_TAG="$RELEASE_TAG"
          cmake --build --preset ${{ matrix.preset }} --target ${{ matrix.target }}

      - name: Configure and build PGO (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --preset ${{ matrix.preset }} -DPORTABLE_BUILD=ON -DCOMP=${{ matrix.compiler }} -DBASILISK_DIST_TAG="$RELEASE_TAG"
          cmake --build --preset ${{ matrix.preset }} --target ${{ matrix.target }}

      - name: Locate the PGO binary and name it for release
        id: asset
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          os="${{ matrix.os_name }}"; arch="${{ matrix.arch }}"
          ext="${{ matrix.ext }}"; suffix="${{ matrix.asset_suffix }}"
          # CMake names the PGO dist binary with a -pgo suffix; publish it under
          # the plain tier name (no -pgo), matching the 1.8.0 asset format.
          built="build/dist/basilisk-${tag}-${os}-${arch}${suffix}-pgo${ext}"
          [ -f "$built" ] || { echo "FAIL: PGO binary $built not found"; ls -la build/dist || true; exit 1; }
          asset="basilisk-${tag}-${os}-${arch}${suffix}${ext}"
          cp "$built" "build/dist/${asset}"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "path=build/dist/${asset}" >> "$GITHUB_OUTPUT"

      # Linux: no program interpreter, so no shared library is needed at all.
      # macOS: arm64 only, and runs from macOS 13.3.
      - name: Verify the binary needs nothing newer than its target (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="${{ steps.asset.outputs.path }}"
          if [ "$RUNNER_OS" = Linux ]; then
            file "$binary"
            if readelf -l "$binary" | grep -q INTERP; then
              echo "FAIL: the Linux binary is dynamically linked"; readelf -d "$binary" | grep NEEDED; exit 1
            fi
          else
            file "$binary"
            archs=$(lipo -archs "$binary")
            [ "$archs" = arm64 ] || { echo "FAIL: architectures are '$archs', not arm64"; exit 1; }
            minos=$(vtool -show-build "$binary" | awk '$1 == "minos" {print $2}')
            echo "minos: $minos"
            [ "$minos" = 13.3 ] || { echo "FAIL: minimum macOS is '$minos', not 13.3"; exit 1; }
          fi

      # The ARM64 contract: the TT prefetch must compile to prfm, and nothing
      # beyond baseline ARMv8 with NEON may appear (tools/diag/verify_isa.py).
      - name: Verify ARM64 ISA contract on the release binary (Linux / macOS)
        if: matrix.arch == 'aarch64' && matrix.os_name != 'windows'
        shell: bash
        run: |
          objdump=$(command -v llvm-objdump || command -v objdump || true)
          python=$(command -v python3 || command -v python || true)
          [ -n "$objdump" ] || { echo "FAIL: no objdump found"; exit 1; }
          [ -n "$python" ] || { echo "FAIL: python not found"; exit 1; }
          # The static Linux binary carries the C runtime; its own archives are
          # exempt, as a dynamic build would load them (verify_isa.py).
          runtime=()
          if [ "$RUNNER_OS" = Linux ]; then
            for a in libc.a libm.a libgcc.a libgcc_eh.a; do runtime+=(--runtime-archive "$(clang++ -print-file-name=$a)"); done
          fi
          "$python" tools/diag/verify_isa.py --tier arm64 --binary "${{ steps.asset.outputs.path }}" \
            --objdump "$objdump" "${runtime[@]}"

      - name: Verify ARM64 ISA contract on the release binary (Windows)
        if: matrix.arch == 'aarch64' && matrix.os_name == 'windows'
        shell: msys2 {0}
        run: |
          objdump=$(command -v llvm-objdump || true)
          python=$(command -v python3 || command -v python || true)
          [ -n "$objdump" ] || { echo "FAIL: llvm-objdump not found"; exit 1; }
          [ -n "$python" ] || { echo "FAIL: python not found"; exit 1; }
          "$python" tools/diag/verify_isa.py --tier arm64 --binary "${{ steps.asset.outputs.path }}" --objdump "$objdump"

      # The universal contract: each tier's functions meet that tier's set,
      # everything shared (dispatcher, Fathom, runtime) the portable set, and
      # the dispatcher reaches all three tiers through CPU detection.
      - name: Verify x86 ISA contract on the release binary (Linux)
        if: matrix.arch == 'x86_64' && matrix.os_name != 'windows'
        shell: bash
        run: |
          # The static binary carries the C runtime; its own archives are
          # exempt, as a dynamic build would load them (verify_isa.py).
          runtime=()
          for a in libc.a libm.a libgcc.a libgcc_eh.a; do runtime+=(--runtime-archive "$(clang++ -print-file-name=$a)"); done
          objdump=$(command -v llvm-objdump || true)
          python=$(command -v python3 || command -v python || true)
          [ -n "$objdump" ] || { echo "FAIL: llvm-objdump not found"; exit 1; }
          [ -n "$python" ] || { echo "FAIL: python not found"; exit 1; }
          launcher=$(find build/universal/CMakeFiles/basilisk_universal.dir \
            -type f \( -name 'main.cpp.o' -o -name 'main.cpp.obj' \) -print -quit)
          [ -n "$launcher" ] || { echo "FAIL: dispatcher object not found"; exit 1; }
          "$python" tools/diag/verify_isa.py \
            --tier universal --binary "${{ steps.asset.outputs.path }}" \
            --launcher-object "$launcher" --objdump "$objdump" "${runtime[@]}"

      - name: Verify x86 ISA contract on the release binary (Windows)
        if: matrix.arch == 'x86_64' && matrix.os_name == 'windows'
        shell: msys2 {0}
        run: |
          objdump=$(command -v llvm-objdump || true)
          python=$(command -v python3 || command -v python || true)
          [ -n "$objdump" ] || { echo "FAIL: llvm-objdump not found"; exit 1; }
          [ -n "$python" ] || { echo "FAIL: python not found"; exit 1; }
          launcher=$(find build/universal/CMakeFiles/basilisk_universal.dir \
            -type f \( -name 'main.cpp.o' -o -name 'main.cpp.obj' \) -print -quit)
          [ -n "$launcher" ] || { echo "FAIL: dispatcher object not found"; exit 1; }
          "$python" tools/diag/verify_isa.py \
            --tier universal --binary "${{ steps.asset.outputs.path }}" \
            --launcher-object "$launcher" --objdump "$objdump"

      # Every tier must reproduce the fingerprint, not only the one this
      # runner selects, and name itself at start-up.
      - name: Bench every forced tier (x86)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ steps.asset.outputs.path }}"
          expected='${{ needs.prepare.outputs.expected_nodes }}'
          echo "selected here: $(printf 'quit\n' | "./$binary" 2>&1 | head -n 1)"
          for isa in base sse41-popcnt avx2 pext; do
            out=$(printf "bench 13\nquit\n" | BASILISK_ISA=$isa "./$binary" 2>&1 || true)
            nodes=$(echo "$out" | grep -oE "Nodes searched *: *[0-9]+" | grep -oE "[0-9]+$" || true)
            echo "$isa: ${nodes:-none} nodes"
            echo "$out" | tr -d '\r' | grep -qE "^Basilisk .* \($isa\)$" \
              || { echo "::error::BASILISK_ISA=$isa did not start the $isa tier"; echo "$out" | head -5; exit 1; }
            [ "$nodes" = "$expected" ] || { echo "::error::the $isa tier benches ${nodes:-none}, not $expected"; exit 1; }
          done

      - name: Smoke-test and fingerprint the asset
        shell: bash
        run: |
          set -euo pipefail
          binary="${{ steps.asset.outputs.path }}"
          if command -v timeout >/dev/null 2>&1; then TIMEOUT="timeout 120";
          elif command -v gtimeout >/dev/null 2>&1; then TIMEOUT="gtimeout 120";
          else TIMEOUT=""; fi
          version='${{ needs.prepare.outputs.version }}'
          output=$(printf "uci\nquit\n" | $TIMEOUT "./$binary" 2>&1 || true)
          echo "$output" | grep -q "^uciok" || { echo "::error::no uciok in the UCI handshake"; echo "$output"; exit 1; }
          # A release names its version; a development build names the commit it
          # was built from in Stockfish's form, and a clean checkout carries no -m.
          if [[ "$version" == *-dev ]]; then
            expected="Basilisk dev-$(git show -s --date=format:%Y%m%d --format=%cd HEAD)-$(git rev-parse HEAD | cut -c1-8)"
          else
            expected="Basilisk $version"
          fi
          echo "$output" | tr -d '\r' | grep -qx "id name $expected" \
            || { echo "::error::id name does not read '$expected'"; echo "$output" | grep '^id name'; exit 1; }
          # The asset must reproduce the declared fingerprint exactly: the move
          # generator, evaluator and search survived PGO on this runner.
          bench_out=$(printf "bench 13\nquit\n" | $TIMEOUT "./$binary" 2>&1 || true)
          nodes=$(echo "$bench_out" | grep -oE "Nodes searched *: *[0-9]+" | grep -oE "[0-9]+$" || true)
          expected='${{ needs.prepare.outputs.expected_nodes }}'
          echo "bench 13: ${nodes:-none} nodes (declared $expected)"
          [ "$nodes" = "$expected" ] || { echo "::error::fingerprint ${nodes:-none} differs from the declared $expected"; echo "$bench_out" | tail -20; exit 1; }
          mkdir -p asset
          cp "$binary" "asset/${{ steps.asset.outputs.asset }}"
          echo "$nodes" > "asset/${{ steps.asset.outputs.asset }}.nodes"

      - name: Upload the asset
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.asset_suffix }}
          path: asset/*
          if-no-files-found: error

  # ---- The universal binary's tier selection, under Intel SDE ---------------
  # SDE emulates older and newer Intel CPUs on the runner: each must start the
  # tier the dispatch rule gives it and reproduce the fingerprint there
  # (tools/diag/check_universal.py). The action is pinned by commit, as the
  # donor pins it.
  select:
    name: Tier selection under SDE (${{ matrix.os_name }})
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            os_name: linux
            asset: linux-x86_64
          - runner: windows-2025
            os_name: windows
            asset: windows-x86_64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the asset
        uses: actions/download-artifact@v7
        with:
          name: asset-${{ matrix.os_name }}-x86_64
          path: asset

      - name: Download SDE
        uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271 # v5.0
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.58.0

      - name: Check the tier each CPU selects
        shell: bash
        run: |
          set -euo pipefail
          binary="asset/basilisk-v${{ needs.prepare.outputs.version }}-${{ matrix.asset }}"
          chmod +x "$binary"
          python=$(command -v python3 || command -v python)
          "$python" tools/diag/check_universal.py --binary "$binary" --sde "$SDE_DIR" \
            --bench '${{ needs.prepare.outputs.expected_nodes }}'

  # ---- The complete matrix: five assets, one fingerprint ---------------------
  collect:
    name: Verify the complete matrix
    needs: [prepare, build, select]
    # The required check for this workflow: it always runs and fails unless
    # every build succeeded, because a job skipped after a failed dependency
    # reports as passing.
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Every build succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS"
          exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) && 1 || 0 }}
      - name: Download the assets
        # v7, not v8 — same reasoning as ci.yml (v8 no longer auto-unzips).
        uses: actions/download-artifact@v7
        with:
          pattern: asset-*
          merge-multiple: true
          path: bundle

      - name: Five assets, one fingerprint
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          tag='v${{ needs.prepare.outputs.version }}'
          expected=(
            "basilisk-${tag}-linux-x86_64" "basilisk-${tag}-linux-aarch64"
            "basilisk-${tag}-windows-x86_64.exe" "basilisk-${tag}-windows-aarch64.exe"
            "basilisk-${tag}-macos-aarch64"
          )
          for f in "${expected[@]}"; do test -f "$f" || { echo "::error::missing asset $f"; ls -la; exit 1; }; done
          test "$(ls | grep -vc '\.nodes$')" -eq 5 || { echo "::error::the bundle does not hold exactly five assets"; ls -la; exit 1; }
          nodes="$(cat ./*.nodes | sort -u)"
          test "$(wc -l <<<"$nodes")" -eq 1 || { echo "::error::the assets disagree on bench 13: $nodes"; exit 1; }
          test "$nodes" = '${{ needs.prepare.outputs.expected_nodes }}'
          rm -f ./*.nodes
          sha256sum "${expected[@]}" | tee SHA256SUMS
          echo "five assets at bench 13 = $nodes"

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: basilisk-${{ needs.prepare.outputs.mode }}-${{ github.sha }}
          path: bundle/*
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.mode == 'candidate' && 30 || 90 }}

  # ---- Publish: a tag push only, after every check has passed ----------------
  publish:
    name: Publish the release
    if: needs.prepare.outputs.mode == 'release' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, collect]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on master or its patch line
        run: |
          git fetch origin master
          python3 tools/diag/release_check.py line "$GITHUB_REF_NAME" --base origin/master

      - name: Download the bundle
        uses: actions/download-artifact@v7
        with:
          name: basilisk-release-${{ github.sha }}
          path: bundle

      - name: Download the release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: notes

      - name: Recheck the bundle
        run: cd bundle && sha256sum --check SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundle/basilisk-v* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Basilisk ${{ needs.prepare.outputs.version }}" \
            --notes-file notes/release-notes.md
