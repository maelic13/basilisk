# Null pair, owed only after a runner, scheduler or topology change.
extend = "common.toml"
command = ["calibrate"]

[options]
games = 30000
tolerance-nelo = 5
concurrency = 14
a-base-ms = 3000
a-increment-ms = 30
a-margin-ms = 20
b-base-ms = 3000
b-increment-ms = 30
b-margin-ms = 20
a-option = ["Hash=64", "Threads=1"]
b-option = ["Hash=64", "Threads=1"]
