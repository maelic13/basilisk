# Rating gauntlet. Participants, labels, ratings and fixed anchors remain on
# the command line because they belong to the event registration. Each slot
# keeps its engine processes from game to game, as every other run does
# (inherited from common.toml).
extend = "common.toml"
command = ["tournament", "run"]

[options]
concurrency = 14
base-ms = 3000
increment-ms = 30
margin-ms = 20
