# BAS-S16 — cluster 5.4.4 check-move depth policy.
#
# Both arms are THE SAME EXECUTABLE. Compiler, PGO profile and binary hash are
# therefore identical and the arms differ only in two UCI values, which removes
# PGO-profile variance from the comparison entirely.
#
#   A = candidate  CheckExtPathCap=2, LmrAllowCheck=1
#   B = baseline   both switches at their inert defaults
#
# Registered in EXPERIMENTS.md before any games. Artifact revision 4936e9b,
# dirty_diff clean, bench 11,941,440, SHA-256 379442F1...D49B8116.

extend = "../profiles/sprt-gainer.toml"

command = ["sprt"]
positionals = [
  "tools/test_engines/basilisk-5.4.4-checkdepth-pext-pgo.exe",
  "tools/test_engines/basilisk-5.4.4-checkdepth-pext-pgo.exe",
]

[options]
# PLAN section 2 specifies [0,3] nElo for a strength mechanism. sprt-gainer.toml
# defaults to elo1 = 5; this experiment is registered at 3 and overrides it
# deliberately rather than by omission.
elo0 = 0
elo1 = 3
model = "normalized"
alpha = 0.05
beta = 0.05
max-pairs = 15000          # 30,000 games, the registered cap

book = "D:/chess/books/UHO_Lichess_4852_v1.epd"
book-order = "random"
seed = 42

# A command-line or run-file list REPLACES the inherited list rather than
# merging with it (colosseum-cli run_file.rs asserts exactly this). Hash and
# Threads are therefore repeated here: omitting them would silently drop the
# profile's Hash=64/Threads=1 from these arms and leave the two sides
# asymmetric, with no error anywhere.
a-label = "bas-s16-candidate"
a-option = ["Hash=64", "Threads=1", "CheckExtPathCap=2", "LmrAllowCheck=1"]
b-label = "bas-s16-baseline"
b-option = ["Hash=64", "Threads=1"]

# Placement stays pinned: durable lesson 0 measured a persistent ~+/-10 Elo
# per-run bias from unpinned scheduler placement, which no sample size removes.
# Each game slot needs one physical core per engine, so on 16 physical cores
# with 2 held back the ceiling is 7 concurrent games, not 14.
concurrency = 7
cores-per-engine = 1

dir = "tools/results/bas-s16"
